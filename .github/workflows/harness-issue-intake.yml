name: Harness Issue Intake

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  intake:
    uses: munichdeveloper/pi-spec-harness/.github/workflows/issue-intake.yml@4353fa758e1f41c30b9a73116b2becf0c3a33f51
