# Managed by pi-spec-harness: issue-intake-reference v1
name: Harness Issue Intake

on:
  issues:
    types: [opened, edited]

concurrency:
  group: harness-issue-intake-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  intake:
    uses: munichdeveloper/pi-spec-harness/.github/workflows/issue-intake.yml@a14f1702f4f77fd2eadbc351b1a228e0982ebe9f
    with:
      issue-number: ${{ github.event.issue.number }}
      issue-title: ${{ github.event.issue.title }}
      issue-body: ${{ github.event.issue.body || '' }}
      harness-ref: 'a14f1702f4f77fd2eadbc351b1a228e0982ebe9f'
