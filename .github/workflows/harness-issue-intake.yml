# Managed by pi-spec-harness: issue-intake-reference v1
name: Harness Issue Intake

on:
  issues:
    types: [opened, edited]

concurrency:
  group: harness-issue-intake-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  intake:
    uses: munichdeveloper/pi-spec-harness/.github/workflows/issue-intake.yml@0a85b0847a5f0a39e120b0c6acc4f85ed2989015
    with:
      issue-number: ${{ github.event.issue.number }}
      issue-title: ${{ github.event.issue.title }}
      issue-body: ${{ github.event.issue.body || '' }}
      harness-ref: '0a85b0847a5f0a39e120b0c6acc4f85ed2989015'
