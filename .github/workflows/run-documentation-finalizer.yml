name: Harness Run Documentation Finalizer Reusable

on:
  workflow_call:
    inputs:
      harness-ref: { required: true, type: string }
      default-branch: { required: false, type: string, default: main }
      generated-directory: { required: false, type: string, default: docs/runs/generated }
      index-path: { required: false, type: string, default: docs/runs/RUN-INDEX.md }
      obsidian-base-path: { required: false, type: string, default: docs/runs/Runs.base }

# TAC-16: minimal permissions; no secrets: inherit.
permissions:
  contents: write
  issues: write
  pull-requests: read
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    concurrency:
      group: harness-run-documentation-finalizer-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0

      - name: Checkout pinned harness implementation
        uses: actions/checkout@v4
        with:
          repository: munichdeveloper/pi-spec-harness
          ref: ${{ inputs.harness-ref }}
          path: .pi-spec-harness

      - uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: npm
          cache-dependency-path: .pi-spec-harness/package-lock.json

      - run: npm ci
        working-directory: .pi-spec-harness

      - name: Persist run documentation snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .pi-spec-harness
        run: |
          npm run harness -- persist-run-documentation \
            --repository "${{ github.repository }}" \
            --issue-number "${{ github.event.issue.number || github.event.pull_request.number }}" \
            --generated-directory "${{ inputs.generated-directory }}" \
            --index-path "${{ inputs.index-path }}" \
            --obsidian-base-path "${{ inputs.obsidian-base-path }}"
