name: Harness Run Documentation Finalizer Reusable

on:
  workflow_call:
    inputs:
      harness-ref: { required: true, type: string }
      default-branch: { required: false, type: string, default: "main" }
      generated-directory: { required: false, type: string, default: docs/runs/generated }
      index-path: { required: false, type: string, default: docs/runs/RUN-INDEX.md }
      obsidian-base-path: { required: false, type: string, default: docs/runs/Runs.base }
      # Comma-separated list of legacy directories to scan for existing run documents.
      # Defaults to "docs/runs" when empty. Each value is passed as a separate --legacy-directory argument.
      legacy-directories: { required: false, type: string, default: "" }
      # REQ-005 audit recorder repository (owner/repo). Defaults to the calling repository.
      audit-recorder-repo: { required: false, type: string, default: "" }
      # Path to the audit journal directory in the recorder repository.
      audit-journal-path: { required: false, type: string, default: "docs/process-audit/journal" }

# TAC-16: minimal permissions; no secrets: inherit.
permissions:
  contents: write
  issues: write
  pull-requests: read
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    concurrency:
      group: harness-run-documentation-finalizer-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0

      - name: Checkout pinned harness implementation
        uses: actions/checkout@v4
        with:
          repository: munichdeveloper/pi-spec-harness
          ref: ${{ inputs.harness-ref }}
          path: .pi-spec-harness

      - uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: npm
          cache-dependency-path: .pi-spec-harness/package-lock.json

      - run: npm ci
        working-directory: .pi-spec-harness

      - name: Build legacy-directory flags
        id: legacy-dirs
        shell: bash
        run: |
          # Convert comma-separated legacy-directories input to CLI flags.
          flags=""
          input="${{ inputs.legacy-directories }}"
          if [ -n "$input" ]; then
            IFS=',' read -ra dirs <<< "$input"
            for dir in "${dirs[@]}"; do
              trimmed="${dir#"${dir%%[![:space:]]*}"}"
              trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"
              [ -n "$trimmed" ] && flags="$flags --legacy-directory \"$trimmed\""
            done
          fi
          echo "flags=$flags" >> "$GITHUB_OUTPUT"

      - name: Persist run documentation snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RECORDER_REPO: ${{ inputs.audit-recorder-repo }}
          LEGACY_DIR_FLAGS: ${{ steps.legacy-dirs.outputs.flags }}
        working-directory: .pi-spec-harness
        run: |
          recorder_args=()
          if [ -n "$AUDIT_RECORDER_REPO" ]; then
            recorder_args=(--audit-recorder-repo "$AUDIT_RECORDER_REPO")
          fi

          # shellcheck disable=SC2086 -- LEGACY_DIR_FLAGS contains intentional word-splitting
          npm run harness -- persist-run-documentation \
            --repository "${{ github.repository }}" \
            --issue-number "${{ github.event.issue.number || github.event.pull_request.number }}" \
            --generated-directory "${{ inputs.generated-directory }}" \
            --index-path "${{ inputs.index-path }}" \
            --obsidian-base-path "${{ inputs.obsidian-base-path }}" \
            --audit-journal-path "${{ inputs.audit-journal-path }}" \
            --harness-version "${{ inputs.harness-ref }}" \
            $LEGACY_DIR_FLAGS \
            "${recorder_args[@]}"
