name: Harness Run Documentation Finalizer Reusable

on:
  workflow_call:
    inputs:
      harness-ref: { required: true, type: string }
      default-branch: { required: false, type: string, default: "main" }
      generated-directory: { required: false, type: string, default: docs/runs/generated }
      index-path: { required: false, type: string, default: docs/runs/RUN-INDEX.md }
      obsidian-base-path: { required: false, type: string, default: docs/runs/Runs.base }
      # JSON array of legacy directories to scan for existing run documents.
      # Example: '["docs/runs/legacy","docs/archive"]'
      # Each element must be a relative path (no absolute, no .., no option-like values).
      # Defaults to empty array (no extra legacy directories).
      legacy-directories: { required: false, type: string, default: "[]" }
      # REQ-005 audit recorder repository (owner/repo). Defaults to the calling repository.
      audit-recorder-repo: { required: false, type: string, default: "" }
      # Path to the audit journal directory in the recorder repository.
      audit-journal-path: { required: false, type: string, default: "docs/process-audit/journal" }

# TAC-16: minimal permissions; no secrets: inherit.
permissions:
  contents: write
  issues: write
  pull-requests: read
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    concurrency:
      group: harness-run-documentation-finalizer-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.default-branch }}
          fetch-depth: 0

      - name: Checkout pinned harness implementation
        uses: actions/checkout@v4
        with:
          repository: munichdeveloper/pi-spec-harness
          ref: ${{ inputs.harness-ref }}
          path: .pi-spec-harness

      - uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: npm
          cache-dependency-path: .pi-spec-harness/package-lock.json

      - run: npm ci
        working-directory: .pi-spec-harness

      - name: Build legacy-directory args
        id: legacy-dirs
        shell: bash
        env:
          LEGACY_DIRS_JSON: ${{ inputs.legacy-directories }}
        run: |
          # Parse JSON array and build validated Bash array of --legacy-directory args.
          # Rejects: absolute paths, traversal (contains ..), empty strings,
          # control characters, and option-like values (start with -).
          legacy_args=()
          while IFS= read -r -d $'\0' dir; do
            # Reject empty
            if [ -z "$dir" ]; then
              echo "::error::legacy-directories: empty path element rejected" >&2
              exit 1
            fi
            # Reject absolute paths
            if [[ "$dir" == /* ]]; then
              echo "::error::legacy-directories: absolute path rejected: $dir" >&2
              exit 1
            fi
            # Reject traversal
            if [[ "$dir" == *..* ]]; then
              echo "::error::legacy-directories: path traversal rejected: $dir" >&2
              exit 1
            fi
            # Reject option-like values (start with -)
            if [[ "$dir" == -* ]]; then
              echo "::error::legacy-directories: option-like path rejected: $dir" >&2
              exit 1
            fi
            # Reject control characters (non-printable ASCII)
            if [[ "$dir" =~ [[:cntrl:]] ]]; then
              echo "::error::legacy-directories: control characters in path rejected" >&2
              exit 1
            fi
            legacy_args+=(--legacy-directory "$dir")
          done < <(node -e "
            const raw = process.env.LEGACY_DIRS_JSON.trim();
            if (!raw || raw === '[]') process.exit(0);
            let arr;
            try { arr = JSON.parse(raw); } catch(e) { process.stderr.write('legacy-directories: invalid JSON\n'); process.exit(1); }
            if (!Array.isArray(arr)) { process.stderr.write('legacy-directories: must be a JSON array\n'); process.exit(1); }
            arr.forEach(e => {
              if (typeof e !== 'string') { process.stderr.write('legacy-directories: array elements must be strings\n'); process.exit(1); }
              process.stdout.write(e + '\0');
            });
          ")
          # Encode the validated args as NUL-delimited in a temp file to pass to the next step.
          # Only write when non-empty — an empty printf would leave a single NUL byte that
          # the reconstruction loop would misread as one empty argument.
          # Use a run-attempt-scoped path to avoid races on shared self-hosted runners.
          LEGACY_ARGS_FILE="${RUNNER_TEMP}/legacy_args_${{ github.run_id }}_${{ github.run_attempt }}.bin"
          echo "legacy_args_file=${LEGACY_ARGS_FILE}" >> "$GITHUB_OUTPUT"
          if [ ${#legacy_args[@]} -gt 0 ]; then
            printf '%s\0' "${legacy_args[@]}" > "${LEGACY_ARGS_FILE}"
          fi

      - name: Persist run documentation snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RECORDER_REPO: ${{ inputs.audit-recorder-repo }}
        working-directory: .pi-spec-harness
        run: |
          recorder_args=()
          if [ -n "$AUDIT_RECORDER_REPO" ]; then
            recorder_args=(--audit-recorder-repo "$AUDIT_RECORDER_REPO")
          fi

          # Reconstruct the legacy_args Bash array from the NUL-delimited temp file.
          legacy_args=()
          LEGACY_ARGS_FILE="${{ steps.legacy-dirs.outputs.legacy_args_file }}"
          if [ -n "$LEGACY_ARGS_FILE" ] && [ -s "$LEGACY_ARGS_FILE" ]; then
            while IFS= read -r -d $'\0' arg; do
              legacy_args+=("$arg")
            done < "$LEGACY_ARGS_FILE"
          fi

          npm run harness -- persist-run-documentation \
            --repository "${{ github.repository }}" \
            --issue-number "${{ github.event.issue.number || github.event.pull_request.number }}" \
            --generated-directory "${{ inputs.generated-directory }}" \
            --index-path "${{ inputs.index-path }}" \
            --obsidian-base-path "${{ inputs.obsidian-base-path }}" \
            --audit-journal-path "${{ inputs.audit-journal-path }}" \
            --harness-version "${{ inputs.harness-ref }}" \
            "${legacy_args[@]}" \
            "${recorder_args[@]}"
