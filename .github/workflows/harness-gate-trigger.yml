name: Harness Gate Trigger

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, edited, synchronize, closed]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  workflow_dispatch: {}
  schedule:
    # Trusted default-branch fallback for suppressed/failed PR event workflows.
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/harness-gate-trigger.yml'

permissions:
  contents: read
  issues: write
  pull-requests: read

# TAC-10: serialise all gate processing repo-wide to avoid concurrent writes
# to the same canonical issue-state.
concurrency:
  group: harness-gate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bind-implementation-pr:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: npm
      - run: npm ci
      - name: Bind agent PR to its canonical run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run harness -- impl-pr-auto-bind \
            --repository "${{ github.repository }}" \
            --pull-request "${{ github.event.pull_request.number }}"

  resume:
    # Gate decision on the tracking issue (label-based human gate)
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'harness:run') &&
      (github.event.label.name == 'harness:gate-approved' ||
       github.event.label.name == 'harness:gate-rejected')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: npm

      - run: npm ci

      - name: Resolve the exact run from the labeled tracking issue
        id: run
        shell: bash
        run: |
          run_id="$(jq -r '.issue.body | (try capture("## Harness Run: `(?<id>[^`]+)`") catch {}) | .id // empty' "$GITHUB_EVENT_PATH")"
          if [[ -z "$run_id" ]]; then
            echo "::error::The labeled issue has no canonical Harness Run header."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Apply the label decision and resume the exact run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          npm run harness -- resume \
            --repository "${{ github.repository }}" \
            --run-id "${{ steps.run.outputs.run_id }}"

      - name: Reconcile delivery PR merge evidence (approval-first path)
        id: merge_effect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          result="$(
            npm run harness -- delivery-pr-merge-effect \
              --repository "${{ github.repository }}" \
              --run-id "${{ steps.run.outputs.run_id }}"
          )"
          printf '%s\n' "$result"
          action="$(printf '%s\n' "$result" | sed -n '/^{/,$p' | jq -r '.result.nextAction.action')"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Orchestrate after gate decision
        if: steps.merge_effect.outputs.action == 'advance-phase'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          npm run harness -- orchestrate \
            --repository "${{ github.repository }}" \
            --run-id "${{ steps.run.outputs.run_id }}"

  orchestrate-on-pr-event:
    # Orchestrate after implementation PR is merged or CI/review events occur
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: npm

      - run: npm ci

      - name: Resolve run from PR body
        id: run
        shell: bash
        run: |
          run_id="$(jq -r '.pull_request.body | (try capture("harness:(?<id>[A-Za-z0-9_-]+)") catch {}) | .id // empty' "$GITHUB_EVENT_PATH")"
          if [[ -z "$run_id" ]]; then
            echo "::notice::No harness run id found in PR body; skipping orchestration."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist delivery PR merge effect
        if: steps.run.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          npm run harness -- delivery-pr-merge-effect \
            --repository "${{ github.repository }}" \
            --run-id "${{ steps.run.outputs.run_id }}" \
            --pull-request "${{ github.event.pull_request.number }}"

      - name: Orchestrate after PR merge
        if: steps.run.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          npm run harness -- orchestrate \
            --repository "${{ github.repository }}" \
            --run-id "${{ steps.run.outputs.run_id }}"

  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: npm

      - run: npm ci

      # Processes every recoverable gate and approved-but-unpersisted delivery
      # merge without selecting the "newest" issue.
      - name: Reconcile all recoverable harness runs
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          npm run --silent harness -- reconcile --repository "${{ github.repository }}" | tee "$RUNNER_TEMP/reconcile.json"

      - name: Dispatch pending run-documentation finalizers
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          workflow_path=".github/workflows/harness-run-documentation-finalizer.yml"
          if ! gh api "repos/${GITHUB_REPOSITORY}/contents/${workflow_path}?ref=${DEFAULT_BRANCH}" >/dev/null 2>&1; then
            pending=$(jq '[.result.reconciled[] | select(.action == "persist-run-documentation")] | length' "$RUNNER_TEMP/reconcile.json")
            if [ "$pending" -gt 0 ]; then
              echo "::error::${pending} run(s) require documentation, but ${workflow_path} is not installed on ${DEFAULT_BRANCH}."
              exit 1
            fi
            exit 0
          fi
          jq -r '.result.reconciled[] | select(.action == "persist-run-documentation") | .issueNumber' "$RUNNER_TEMP/reconcile.json" |
          while read -r issue_number; do
            gh workflow run "$workflow_path" --ref "$DEFAULT_BRANCH" -f "issue-number=$issue_number"
          done

  review-fix:
    # SPEC-009 TAC-04/TAC-09: Start a review-fix iteration when a trusted reviewer
    # submits a review. Bot-own events and duplicate submissions are rejected inside
    # the harness CLI (idempotency key + loop guard).
    # Thread state is read live through GraphQL by review-fix and verification;
    # GitHub Actions does not expose pull_request_review_thread as a trigger.
    if: >-
      github.event_name == 'pull_request_review' &&
      (github.event.review.state == 'changes_requested' ||
       github.event.review.state == 'commented')
    runs-on: ubuntu-latest
    # SPEC-009 decision 1: serialise per-run to prevent concurrent SHA mutations.
    concurrency:
      group: harness-review-fix-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Execute only the already merged harness implementation. Checking out
      # the reviewed PR head here would run untrusted code with issue/PR write
      # permissions. The first self-hosting PR therefore needs the documented
      # manual bootstrap path; subsequent reviews are fully event-driven.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: npm

      - run: npm ci

      - name: Process review event and classify threads
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS_TRUSTED_REVIEW_ACTORS: ${{ vars.HARNESS_TRUSTED_REVIEW_ACTORS || 'copilot-pull-request-reviewer' }}
          HARNESS_REVIEW_FIX_AGENT: ${{ vars.HARNESS_REVIEW_FIX_AGENT || 'github-copilot' }}
        shell: bash
        run: |
          review_id="${{ github.event.review.id }}"
          pr_number="${{ github.event.pull_request.number }}"
          head_sha="${{ github.event.review.commit_id }}"
          reviewer="${{ github.event.review.user.login }}"
          reviewer_type="${{ github.event.review.user.type }}"
          review_state="${{ github.event.review.state }}"
          submitted_at="${{ github.event.review.submitted_at }}"

          result="$(
            npm run harness -- review-fix \
              --repository "${{ github.repository }}" \
              --pull-request "$pr_number" \
              --review-id "$review_id" \
              --head-sha "$head_sha" \
              --reviewer "$reviewer" \
              --reviewer-type "$reviewer_type" \
              --review-state "$review_state" \
              --submitted-at "$submitted_at" \
              --trusted-actors "$HARNESS_TRUSTED_REVIEW_ACTORS" \
              --fix-agent "$HARNESS_REVIEW_FIX_AGENT" \
              --self-actor-login "github-actions[bot]"
          )"
          printf '%s\n' "$result"
          has_actionable="$(printf '%s\n' "$result" | sed -n '/^{/,$p' | jq -r '.result.hasActionable // false')"
          echo "has_actionable=$has_actionable" >> "$GITHUB_OUTPUT"
