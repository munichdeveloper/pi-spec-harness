name: Harness Gate Trigger

on:
  issues:
    types: [labeled]
  pull_request:
    types: [closed]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/harness-gate-trigger.yml'

permissions:
  contents: read
  issues: write

# TAC-10: serialise all gate processing repo-wide to avoid concurrent writes
# to the same canonical issue-state.
concurrency:
  group: harness-gate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  resume:
    # Gate decision on the tracking issue (label-based human gate)
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'harness:run') &&
      (github.event.label.name == 'harness:gate-approved' ||
       github.event.label.name == 'harness:gate-rejected')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: npm

      - run: npm ci

      - name: Resolve the exact run from the labeled tracking issue
        id: run
        shell: bash
        run: |
          run_id="$(jq -r '.issue.body | (try capture("## Harness Run: `(?<id>[^`]+)`") catch {}) | .id // empty' "$GITHUB_EVENT_PATH")"
          if [[ -z "$run_id" ]]; then
            echo "::error::The labeled issue has no canonical Harness Run header."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Apply the label decision and resume the exact run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          result="$(
            npm run harness -- resume \
              --repository "${{ github.repository }}" \
              --run-id "${{ steps.run.outputs.run_id }}"
          )"
          printf '%s\n' "$result"
          action="$(printf '%s\n' "$result" | sed -n '/^{/,$p' | jq -r '.result.nextAction.action')"
          if [[ "$action" == "advance-phase" ]]; then
            npm run harness -- orchestrate \
              --repository "${{ github.repository }}" \
              --run-id "${{ steps.run.outputs.run_id }}"
          fi

  orchestrate-on-pr-event:
    # Orchestrate after implementation PR is merged or CI/review events occur
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: npm

      - run: npm ci

      - name: Resolve run from PR body
        id: run
        shell: bash
        run: |
          run_id="$(jq -r '.pull_request.body | (try capture("harness:(?<id>[a-z0-9_-]+)") catch {}) | .id // empty' "$GITHUB_EVENT_PATH")"
          if [[ -z "$run_id" ]]; then
            echo "::notice::No harness run id found in PR body; skipping orchestration."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          fi

      - name: Orchestrate after PR merge
        if: steps.run.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          npm run harness -- orchestrate \
            --repository "${{ github.repository }}" \
            --run-id "${{ steps.run.outputs.run_id }}"

  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: npm

      - run: npm ci

      # TAC-09/TAC-10: Bootstrap reconciliation on workflow installation or manual dispatch.
      # Processes all open harness gates in the repository without selecting by "newest" issue.
      - name: Reconcile all open harness gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          npm run harness -- reconcile --repository "${{ github.repository }}"

  review-fix:
    # SPEC-009 TAC-04/TAC-09: Start a review-fix iteration when a trusted reviewer
    # submits a review. Bot-own events and duplicate submissions are rejected inside
    # the harness CLI (idempotency key + loop guard).
    # pull_request_review_thread.resolved/unresolved events are handled as no-ops
    # at the CLI level; only pull_request_review.submitted triggers an iteration.
    if: >-
      github.event_name == 'pull_request_review' &&
      (github.event.review.state == 'changes_requested' ||
       github.event.review.state == 'commented')
    runs-on: ubuntu-latest
    # SPEC-009 decision 1: serialise per-run to prevent concurrent SHA mutations.
    concurrency:
      group: harness-review-fix-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.9"
          cache: npm

      - run: npm ci

      - name: Process review event and classify threads
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS_TRUSTED_REVIEW_ACTORS: ${{ vars.HARNESS_TRUSTED_REVIEW_ACTORS || 'copilot-pull-request-reviewer' }}
          HARNESS_REVIEW_FIX_AGENT: ${{ vars.HARNESS_REVIEW_FIX_AGENT || 'github-copilot' }}
        shell: bash
        run: |
          review_id="${{ github.event.review.id }}"
          pr_number="${{ github.event.pull_request.number }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          reviewer="${{ github.event.review.user.login }}"
          reviewer_type="${{ github.event.review.user.type }}"
          review_state="${{ github.event.review.state }}"
          submitted_at="${{ github.event.review.submitted_at }}"

          result="$(
            npm run harness -- review-fix \
              --repository "${{ github.repository }}" \
              --pull-request "$pr_number" \
              --review-id "$review_id" \
              --head-sha "$head_sha" \
              --reviewer "$reviewer" \
              --reviewer-type "$reviewer_type" \
              --review-state "$review_state" \
              --submitted-at "$submitted_at" \
              --trusted-actors "$HARNESS_TRUSTED_REVIEW_ACTORS" \
              --fix-agent "$HARNESS_REVIEW_FIX_AGENT"
          )"
          printf '%s\n' "$result"
          has_actionable="$(printf '%s\n' "$result" | sed -n '/^{/,$p' | jq -r '.result.hasActionable // false')"
          echo "has_actionable=$has_actionable" >> "$GITHUB_OUTPUT"
