name: Harness Process Audit Receiver

# SPEC-005 process_audit receiver for the harness repository.
#
# Receives `repository_dispatch` events of type `process_audit` dispatched by
# the harness run-documentation-finalizer (or any other SPEC-005-compliant
# harness producer) and delegates to the reusable process-audit-automation
# workflow for validated, idempotent, conflict-safe journal recording.
#
# For target repositories that use the harness: install a copy of this file
# (or a file with the same structure) via `harness install`.  Change the
# `uses:` ref to the specific harness version pinned by the project.

on:
  repository_dispatch:
    types: [process_audit]

permissions:
  contents: write

jobs:
  record:
    uses: ./.github/workflows/process-audit-automation.yml
    with:
      # Pass the envelope-v1 audit object as a JSON string.
      # toJson() serialises the already-parsed GitHub event object; the
      # payload value is never interpolated into shell commands.
      audit-payload-json: ${{ toJson(github.event.client_payload.audit) }}
      journal-dir: docs/process-audit/journal
      harness-ref: main
    permissions:
      contents: write
