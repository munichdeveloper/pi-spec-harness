# Managed by pi-spec-harness: process-audit-receiver-reference v1
name: Harness Process Audit Receiver

# SPEC-005 process_audit receiver.
#
# Receives `repository_dispatch` events of type `process_audit` dispatched by
# the harness run-documentation-finalizer (or any other SPEC-005-compliant
# harness producer) and delegates to the immutable reusable workflow release.
# The harness repository intentionally uses the same managed receiver contract
# as every consumer repository so the documentation finalizer can attest it.

on:
  repository_dispatch:
    types: [process_audit]

permissions:
  contents: write

jobs:
  record:
    uses: munichdeveloper/pi-spec-harness/.github/workflows/process-audit-automation.yml@686178aa8160c296b334e7b6b9e63f0b4e719ad1
    with:
      audit-payload-json: ${{ toJson(github.event.client_payload.audit) }}
      journal-dir: 'docs/process-audit/journal'
      harness-ref: '686178aa8160c296b334e7b6b9e63f0b4e719ad1'
    permissions:
      contents: write
