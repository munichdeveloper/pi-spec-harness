# Managed by pi-spec-harness: run-documentation-finalizer-reference v1
name: Harness Run Documentation Finalizer

on:
  workflow_dispatch:
    inputs:
      issue-number:
        description: Tracking issue number selected by trusted reconciliation
        required: true
        type: string
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
  pull-requests: read
  actions: read

jobs:
  finalize:
    # The harness repository calls its own reusable workflow locally. Remote
    # same-repository SHA calls failed before runner assignment (issue #96),
    # while consumer repositories continue to use the immutable remote template.
    # Concurrency is owned by the reusable job so caller and callee cannot
    # deadlock on the same non-cancelling concurrency key (issue #96).
    uses: ./.github/workflows/run-documentation-finalizer.yml
    with:
      harness-ref: '686178aa8160c296b334e7b6b9e63f0b4e719ad1'
      default-branch: 'main'
      generated-directory: 'docs/runs/generated'
      index-path: 'docs/runs/RUN-INDEX.md'
      obsidian-base-path: 'docs/runs/Runs.base'
      issue-number: ${{ inputs.issue-number || github.event.issue.number }}
