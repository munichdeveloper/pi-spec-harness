# Managed by pi-spec-harness: review-fix-reference v1
name: Harness Review Fix

on:
  pull_request_review:
    types: [submitted]
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review-fix:
    uses: munichdeveloper/pi-spec-harness/.github/workflows/review-fix.yml@v0.2.4
    with:
      harness-ref: 'v0.2.4'
      pull-request: ${{ github.event.pull_request.number }}
      review-id: ${{ github.event.review.id || 0 }}
      reviewed-head-sha: ${{ github.event.review.commit_id || github.event.pull_request.head.sha }}
      reviewer: ${{ github.event.review.user.login || '' }}
      reviewer-type: ${{ github.event.review.user.type || '' }}
      review-state: ${{ github.event.review.state || '' }}
      submitted-at: ${{ github.event.review.submitted_at || '' }}
      trusted-actors: 'copilot-pull-request-reviewer'
      fix-agent: 'github-copilot'
