name: Harness Capability Smoke Reusable

on:
  workflow_call:
    inputs:
      claude-code-action-version:
        description: >
          Informational: the version tag or SHA the caller expects to be running
          (e.g. v1.0.94). This value is informational only: it is compared
          against the hardcoded pin and emits a warning on mismatch. It does
          NOT change the action version executed by this workflow (always
          hardcoded to anthropics/claude-code-action@v1.0.94) and is not
          persisted anywhere.
        required: false
        type: string
        default: v1.0.94
    secrets:
      ANTHROPIC_API_KEY:
        description: >
          Anthropic API key for the claude-code-action. Provide exactly one of
          ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN; supplying both will fail
          the check-credentials pre-flight.
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        description: >
          Claude Code OAuth token for the claude-code-action. Provide exactly
          one of ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN; supplying both
          will fail the check-credentials pre-flight.
        required: false

# TAC-10: minimal permissions – OIDC is required by the pinned Claude action;
# no contents:write, issues:write, pull-requests:write, or deployments:write.
permissions:
  contents: read
  actions: write   # required only for cache save/restore
  id-token: write  # required only to mint the action's short-lived GitHub OIDC token

concurrency:
  # AC-08: bind to the actual capability contract, not the possibly-different caller input.
  # Full action pin + canonical sorted allow list + contract version = deterministic group key.
  group: harness-capability-smoke-${{ github.repository }}-anthropics/claude-code-action@v1.0.94-Bash_Edit_Write-cv1
  cancel-in-progress: false

jobs:
  # ─── Job 1: check credentials before spending any compute ──────────────────
  check-credentials:
    name: Check credentials (TAC-11)
    runs-on: ubuntu-latest
    outputs:
      has_credentials: ${{ steps.check.outputs.has_credentials }}
    steps:
      - name: Verify at least one credential is available
        id: check
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" && -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "::error::Neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set. Capability smoke cannot run without credentials."
            echo "has_credentials=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [[ -n "$ANTHROPIC_API_KEY" && -n "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "::error::Both ANTHROPIC_API_KEY and CLAUDE_CODE_OAUTH_TOKEN are set. Provide exactly one credential."
            echo "has_credentials=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "has_credentials=true" >> "$GITHUB_OUTPUT"

      - name: Warn if claude-code-action-version input differs from hardcoded pin
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.claude-code-action-version }}
        run: |
          PINNED_REF="anthropics/claude-code-action@v1.0.94"
          # Normalise: accept either the full ref or the bare tag
          normalised="${INPUT_VERSION}"
          if [[ "$normalised" != *"/"* ]]; then
            normalised="anthropics/claude-code-action@${INPUT_VERSION}"
          fi
          if [[ -n "$INPUT_VERSION" && "$normalised" != "$PINNED_REF" ]]; then
            echo "::warning::claude-code-action-version input ('${INPUT_VERSION}') differs from the hardcoded uses: pin ('${PINNED_REF}'). The smoke will always execute the pinned version; the fingerprint is bound to that pin. Update the workflow to change the effective version."
          fi

  # ─── Job 2: compute fingerprint & check attestation cache ──────────────────
  check-attestation:
    name: Compute fingerprint and check cache (TAC-01/TAC-02/TAC-06)
    needs: check-credentials
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
      cache_key: ${{ steps.fingerprint.outputs.cache_key }}
      cache_hit: ${{ steps.restore.outputs.cache-hit }}
    steps:
      - name: Compute fingerprint
        id: fingerprint
        shell: bash
        env:
          # Must match the hardcoded pin in the smoke job's `uses:` step.
          # `uses:` cannot reference the inputs context, so both must be kept
          # in sync manually. Using the input here would attest a version that
          # was never actually executed.
          ACTION_REF: "anthropics/claude-code-action@v1.0.94"
        run: |
          # Canonical permissions: sorted, compact JSON
          permissions_allow='["Bash(*)","Edit","Write"]'
          contract_version="1"

          # Build the exact same input string as src/capability/fingerprint.ts
          canonical_permissions="$(echo -n "$permissions_allow" | jq -c 'sort')"
          # Use printf to build the newline-separated input (YAML-safe; no literal newlines in YAML block)
          fingerprint_input="$(printf '%s\n%s\n%s' "${ACTION_REF}" "${canonical_permissions}" "${contract_version}")"

          fingerprint="$(echo -n "$fingerprint_input" | sha256sum | cut -d' ' -f1)"
          cache_key="harness-capability-attestation-${fingerprint}"

          echo "fingerprint=${fingerprint}" >> "$GITHUB_OUTPUT"
          echo "cache_key=${cache_key}" >> "$GITHUB_OUTPUT"
          echo "Fingerprint: ${fingerprint}"
          echo "Cache key:   ${cache_key}"

      # TAC-02: exact key only – no restore-keys (prefix matching is forbidden)
      - name: Restore attestation cache (exact key only)
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: capability-attestation.json
          key: ${{ steps.fingerprint.outputs.cache_key }}
          # No restore-keys – TAC-02 forbids prefix matching

      - name: Validate existing attestation manifest
        if: steps.restore.outputs.cache-hit == 'true'
        id: validate
        shell: bash
        run: |
          if [[ ! -f capability-attestation.json ]]; then
            echo "::error::Cache claimed a hit but attestation file is missing."
            exit 1
          fi
          # TAC-02: validate manifest against the computed fingerprint
          cached_fp="$(jq -r '.fingerprint' capability-attestation.json)"
          expected_fp="${{ steps.fingerprint.outputs.fingerprint }}"
          if [[ "$cached_fp" != "$expected_fp" ]]; then
            echo "::error::Cached attestation fingerprint '$cached_fp' does not match computed '$expected_fp'."
            exit 1
          fi
          schema_version="$(jq -r '.schemaVersion' capability-attestation.json)"
          if [[ "$schema_version" != "1" ]]; then
            echo "::error::Unsupported attestation schema version: $schema_version"
            exit 1
          fi
          echo "Attestation cache valid – skipping smoke (TAC-06)."
          jq . capability-attestation.json

  # ─── Job 3: run the capability smoke (only on cache miss) ──────────────────
  smoke:
    name: Run capability smoke (TAC-04/TAC-05)
    needs: check-attestation
    if: needs.check-attestation.outputs.cache_hit != 'true'
    runs-on: ubuntu-latest
    outputs:
      bash_ok: ${{ steps.verify.outputs.bash_ok }}
      write_ok: ${{ steps.verify.outputs.write_ok }}
      edit_ok: ${{ steps.verify.outputs.edit_ok }}
      file_content_ok: ${{ steps.verify.outputs.file_content_ok }}
      smoke_passed: ${{ steps.verify.outputs.smoke_passed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate ephemeral random marker
        id: marker
        shell: bash
        run: |
          marker="$(openssl rand -hex 16)"
          echo "marker=${marker}" >> "$GITHUB_OUTPUT"

      - name: Run capability smoke via claude-code-action
        id: agent
        # NOTE: uses: cannot reference inputs context – pin is hardcoded.
        # Must be bumped together with the input default above.
        uses: anthropics/claude-code-action@v1.0.94
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The default-branch push bridge dispatches this workflow as the
          # GitHub Actions bot. Keep this exact allowlist; never use `*`.
          allowed_bots: github-actions
          settings: '{"permissions":{"allow":["Bash(*)","Write","Edit"]}}'
          show_full_output: true
          prompt: |
            You are running a capability smoke test. Follow these exact steps and no others.
            Do not create commits, push code, or open pull requests.

            MARKER=${{ steps.marker.outputs.marker }}

            Step 1 – Bash: Run the following command and verify it succeeds:
              echo "harness-smoke-bash-ok"

            Step 2 – Write: Create a new file at path ${{ github.workspace }}/harness-smoke-${{ steps.marker.outputs.marker }}.txt
            (do not use /tmp or any absolute path outside the workspace)
            with this exact content (one line, no trailing newline):
              SMOKE_WRITE_${{ steps.marker.outputs.marker }}

            Step 3 – Edit: Open ${{ github.workspace }}/harness-smoke-${{ steps.marker.outputs.marker }}.txt and replace
            SMOKE_WRITE_ with SMOKE_EDIT_ so the final content is:
              SMOKE_EDIT_${{ steps.marker.outputs.marker }}

            When done, output nothing else. Your output is not evidence; only the tool calls are.

      - name: Deterministic verifier (TAC-04/TAC-05)
        id: verify
        shell: bash
        run: |
          marker="${{ steps.marker.outputs.marker }}"
          smoke_file="${GITHUB_WORKSPACE}/harness-smoke-${marker}.txt"
          expected_content="SMOKE_EDIT_${marker}"

          bash_ok=false
          write_ok=false
          edit_ok=false
          file_content_ok=false

          # Parse tool-call evidence from the action's structured output file.
          # execution_file is a path; read its contents before parsing.
          execution_file_path="${{ steps.agent.outputs.execution_file }}"

          # Correlate native Claude tool_use and tool_result records. Text
          # mentioning tools, orphan results and failed calls are not evidence.
          check_tool_success() {
            local tool_name="$1"
            node - "$execution_file_path" "$tool_name" <<'NODE'
          const fs = require('node:fs');
          try {
            const raw = fs.readFileSync(process.argv[2], 'utf8');
            let events;
            try {
              const parsed = JSON.parse(raw);
              events = Array.isArray(parsed) ? parsed : [parsed];
            } catch {
              events = raw.split(/\r?\n/).filter(line => line.trim()).map(line => JSON.parse(line));
            }
            const calls = new Map();
            const results = new Map();
            const invalid = new Set();
            for (const event of events) {
              if (!event || typeof event.session_id !== 'string' || !event.session_id) continue;
              if (!Array.isArray(event.message?.content)) continue;
              for (const block of event.message.content) {
                if (!block || typeof block !== 'object') continue;
                if (event.type === 'assistant' && block.type === 'tool_use' && typeof block.id === 'string' && block.id) {
                  const key = JSON.stringify([event.session_id, block.id]);
                  if (calls.has(key)) invalid.add(key);
                  calls.set(key, block.name);
                }
                if (event.type === 'user' && block.type === 'tool_result' && typeof block.tool_use_id === 'string' && block.tool_use_id) {
                  const key = JSON.stringify([event.session_id, block.tool_use_id]);
                  if (!calls.has(key) || results.has(key)) invalid.add(key);
                  results.set(key, (block.is_error === undefined || block.is_error === false) && Object.hasOwn(block, 'content'));
                }
              }
            }
            const passed = [...calls].some(([key, name]) => name === process.argv[3] && results.get(key) === true && !invalid.has(key));
            process.exit(passed ? 0 : 1);
          } catch {
            process.exit(1);
          }
          NODE
          }

          # Bash evidence: any successful Bash tool call
          if check_tool_success "Bash"; then
            bash_ok=true
          fi

          # Write evidence: successful Write tool call
          if check_tool_success "Write"; then
            write_ok=true
          fi

          # Edit evidence: successful Edit tool call
          if check_tool_success "Edit"; then
            edit_ok=true
          fi

          # File content verification
          if [[ -f "$smoke_file" ]]; then
            actual_content="$(cat "$smoke_file")"
            if [[ "$actual_content" == "$expected_content" ]]; then
              file_content_ok=true
            else
              echo "::error::File content mismatch. Expected: '$expected_content', Got: '$actual_content'"
            fi
          else
            echo "::error::Smoke file '$smoke_file' not found."
          fi

          echo "bash_ok=${bash_ok}"       >> "$GITHUB_OUTPUT"
          echo "write_ok=${write_ok}"     >> "$GITHUB_OUTPUT"
          echo "edit_ok=${edit_ok}"       >> "$GITHUB_OUTPUT"
          echo "file_content_ok=${file_content_ok}" >> "$GITHUB_OUTPUT"

          if [[ "$bash_ok" == true && "$write_ok" == true && "$edit_ok" == true && "$file_content_ok" == true ]]; then
            echo "smoke_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "smoke_passed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Capability smoke failed. bash_ok=$bash_ok write_ok=$write_ok edit_ok=$edit_ok file_content_ok=$file_content_ok"
          fi

  # ─── Job 4: write attestation on verified success (TAC-03/TAC-06) ──────────
  attest:
    name: Write attestation cache (TAC-03)
    needs: [check-attestation, smoke]
    if: needs.smoke.outputs.smoke_passed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Write attestation manifest
        shell: bash
        run: |
          fingerprint="${{ needs.check-attestation.outputs.fingerprint }}"
          run_id="${{ github.run_id }}"
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > capability-attestation.json <<JSON
          {
            "schemaVersion": "1",
            "fingerprint": "${fingerprint}",
            "contractVersion": "1",
            "capabilityContract": {
              "bash": true,
              "write": true,
              "edit": true,
              "fileContentVerified": true
            },
            "workflowRun": "${run_id}",
            "attestedAt": "${timestamp}"
          }
          JSON
          jq . capability-attestation.json

      # TAC-03: only a fully successful run reaches this step
      - name: Save attestation to cache
        uses: actions/cache/save@v4
        with:
          path: capability-attestation.json
          key: ${{ needs.check-attestation.outputs.cache_key }}

  # ─── Job 5: gate – fail the whole workflow on smoke failure (TAC-08) ───────
  gate:
    name: Capability gate (TAC-08)
    needs: [check-attestation, smoke]
    # Run only when smoke actually executed (not skipped/failed due to a
    # prerequisite failure).  A cache-hit skips smoke entirely; in that case
    # the gate is not needed.  If check-attestation itself failed the gate
    # must not emit the misleading "Capability smoke failed" message.
    if: always() && needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Fail on smoke failure
        if: needs.smoke.outputs.smoke_passed != 'true'
        shell: bash
        run: |
          echo "::error::Capability smoke failed. The productive agent step will not run."
          echo "::error::Failed capabilities – bash_ok=${{ needs.smoke.outputs.bash_ok }} write_ok=${{ needs.smoke.outputs.write_ok }} edit_ok=${{ needs.smoke.outputs.edit_ok }} file_content_ok=${{ needs.smoke.outputs.file_content_ok }}"
          exit 1

      - name: Smoke passed
        if: needs.smoke.outputs.smoke_passed == 'true'
        shell: bash
        run: echo "All capabilities verified. Attestation written."
